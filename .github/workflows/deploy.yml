name: Deploy semilla

# Despliegue automatico con un solo push a main.
# El servidor (Contabo VPS, semilla.indoamericatech.com) corre el despliegue ya
# probado: git reset --hard origin/main + docker compose up -d --build.
# La llave SSH usada es dedicada y esta restringida por "command=" en
# authorized_keys: solo puede ejecutar /home/.../semilla-app/deploy.sh, nada mas.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-semilla
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger server deploy over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # El comando enviado se ignora: authorized_keys fuerza deploy.sh.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" deploy
